<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GSOC Disaster Portal</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">

    <div class="header-content">

      <h1>GSOC Disaster Portal</h1>

      <p>
        Quick Access to Disaster Information
      </p>

    </div>

  </header>


  <main class="main-content">

    <section class="intro-section">

      <p class="section-label">
        SELECT DISASTER TYPE
      </p>

      <h2>
        What do you want to monitor?
      </h2>

      <p class="section-description">
        Select a disaster type to access country-specific information sources.
      </p>

    </section>


    <section class="disaster-grid">

      <!-- Earthquake -->
      <a
        href="earthquake.html"
        class="disaster-card"
      >

        <div class="disaster-icon">
          🌏
        </div>

        <div class="disaster-text">

          <h3>
            지진
          </h3>

          <p>
            Earthquake
          </p>

        </div>

        <span class="arrow">
          →
        </span>

      </a>


      <!-- Typhoon -->
      <a
        href="typhoon.html"
        class="disaster-card"
      >

        <div class="disaster-icon">
          🌀
        </div>

        <div class="disaster-text">

          <h3>
            태풍
          </h3>

          <p>
            Typhoon
          </p>

        </div>

        <span class="arrow">
          →
        </span>

      </a>


      <!-- Heavy Rain -->
      <a
        href="rain.html"
        class="disaster-card"
      >

        <div class="disaster-icon">
          🌧️
        </div>

        <div class="disaster-text">

          <h3>
            호우
          </h3>

          <p>
            Heavy Rain
          </p>

        </div>

        <span class="arrow">
          →
        </span>

      </a>


      <!-- Heavy Snow -->
      <a
        href="snow.html"
        class="disaster-card"
      >

        <div class="disaster-icon">
          ❄️
        </div>

        <div class="disaster-text">

          <h3>
            대설
          </h3>

          <p>
            Heavy Snow
          </p>

        </div>

        <span class="arrow">
          →
        </span>

      </a>

    </section>

  </main>


  <footer class="site-footer">

    GSOC Disaster Portal

  </footer>

</body>
</html>
